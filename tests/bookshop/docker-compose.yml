services:
  n8n:
    image: n8nio/n8n:2.35.4@sha256:2f9c115b71c9c2f3e856ba8debecf26dfd6a8fca67a6790e32d63b3931b7c2d4
    container_name: bookshop-n8n
    # Run as the host user so bind-mounted ./.n8n-data is writable regardless of
    # host UID/GID. In CI, N8N_UID/N8N_GID are exported before `docker compose up`.
    # Locally, they default to the current user via the shell expansion below.
    user: "${N8N_UID:-1000}:${N8N_GID:-1000}"
    ports:
      - "5678:5678"
    environment:
      - N8N_USER_FOLDER=/home/node/.n8n
      # Disable auth for local dev only
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_VERSION_NOTIFICATIONS_ENABLED=false
      - N8N_TEMPLATES_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
      - GENERIC_TIMEZONE=UTC
    volumes:
      - ./.n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'wget -qO- http://localhost:5678/healthz | grep -q ''"status":"ok"'' || exit 1',
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    restart: unless-stopped
